name: Sync BtbN upstream

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/upstream-sync.yml'
      - '.github/scripts/sync_upstream.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  # This listener runs from our default branch, even though the mirror must
  # retain upstream's unfiltered push workflow. Never check out the triggering ref.
  workflow_run:
    workflows: ['Build FFmpeg']
    types: [requested, in_progress]
    branches: [master-BtbN, sync/btbn-master]

permissions: {}

concurrency:
  group: btbn-sync-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 'update' }}
  cancel-in-progress: false

jobs:
  cancel-mirror-build:
    if: >-
      github.repository == 'abrar71/FFmpeg-Builds' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/build.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel duplicate full build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          code=$(curl --silent --show-error --retry 3 --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output "$RUNNER_TEMP/cancel-response.json" --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel")
          case "$code" in
            202) echo "Cancelled mirror/sync-branch build $RUN_ID." ;;
            409) echo "Build $RUN_ID is already finished or being cancelled." ;;
            *) echo "Cancellation failed: HTTP $code"; exit 1 ;;
          esac

  sync:
    if: >-
      github.repository == 'abrar71/FFmpeg-Builds' &&
      github.event_name != 'workflow_run' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check App configuration
        env:
          APP_CLIENT_ID: ${{ vars.UPSTREAM_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo 'Set the UPSTREAM_SYNC_APP_CLIENT_ID repository variable and UPSTREAM_SYNC_APP_PRIVATE_KEY repository secret; see docs/upstream-sync.md.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.UPSTREAM_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: FFmpeg-Builds
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-statuses: write
      - name: Mirror upstream and open or update review PR
        env:
          UPSTREAM_SYNC_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 .github/scripts/sync_upstream.py
